[project]
name = "serp-engine"
version = "0.1.0"
description = "Google SERP scraping engine: fast HTTP mode with automatic browser fallback"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "patchright>=1.49",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
serp = "serp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["serp"]
